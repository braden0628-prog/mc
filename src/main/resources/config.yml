# CoreEssentials configuration

tpr:
  # How many seconds before a pending /tpr request expires
  expire-seconds: 60

homes:
  # Max named homes per player
  max-homes: 3

rtp:
  # Cooldown in seconds between /rtp uses
  cooldown-seconds: 5
  # Search radius around world spawn
  radius: 1000
  # Minimum distance from world spawn (avoids landing right on top of it)
  min-radius: 100
  # How many attempts to find a safe location before giving up
  max-attempts: 20

vein-miner:
  # Blocks broken per enchant level (level 1 = 16, level 2 = 32, level 3 = 48)
  blocks-per-level: 16
  # Hard cap regardless of level, to protect server performance
  max-blocks: 64
